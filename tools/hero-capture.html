<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Captura del video de portada</title>
<link rel="stylesheet" href="../css/site.css">
<style>body{margin:0;overflow:hidden}#hs{position:fixed;inset:0}.lock{transition:none}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hs"><div class="lock" id="lock"><b></b><span>Dron · seguimiento</span></div></div>
<script type="module">
// Página de herramienta: dibujo la escena de la portada con tiempo controlado para grabar un video en bucle.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildCity, makeDrone } from '../js/city.js';
import { createScout, aimRig } from '../js/scout-model.js';

const LOOP_SECONDS = 24;
const WARMUP_FPS = 30;
const PROP_TURNS = 210;
const LED_PULSES = 11;
const SCOUT_EYE = 0.17;
const OMEGA = (Math.PI * 2) / LOOP_SECONDS;
const vec = (x, y, z) => new THREE.Vector3(x, y, z);

const container = document.getElementById('hs');
const lock = document.getElementById('lock');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.prepend(renderer.domElement);

const scene = new THREE.Scene();
const { city, sky, ours } = buildCity(renderer.capabilities.getMaxAnisotropy());
scene.background = sky;
scene.fog = new THREE.Fog(0xeef5f9, 40, 330);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
scene.add(city, new THREE.HemisphereLight(0xe3f2ff, 0x9b9080, 1.1));
const sun = new THREE.DirectionalLight(0xfff1de, 2.6);
sun.position.set(28, 42, 22);
sun.target.position.set(-4, 0, -12);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(4096);
Object.assign(sun.shadow.camera, { left: -46, right: 46, top: 46, bottom: -46, near: 1, far: 140 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const scout = new THREE.Group();
scout.position.set(ours.rightX - 0.7, ours.roofY + 0.4, ours.frontZ + 0.09);
scout.rotation.y = Math.atan2(-1, -0.55);
scene.add(scout);
const eye = scout.position.clone().add(vec(0, SCOUT_EYE, 0));
const drone = makeDrone();
scene.add(drone.group);

const width = innerWidth;
const height = innerHeight;
renderer.setSize(width, height);
const camera = new THREE.PerspectiveCamera(34, (width * 1.5) / height, 0.05, 800);
camera.setViewOffset(width * 1.5, height, 0, 0, width, height);

const rig = await createScout();
scout.add(rig.root);
const state = { pan: 0, tilt: 0.4 };

const dronePosition = (t) => eye.clone().add(vec(-6.5 + 3.2 * Math.sin(OMEGA * t), 2.3 + 0.7 * Math.sin(2 * OMEGA * t), -7.6 + 2.2 * Math.cos(OMEGA * t)));

const step = (t, alpha) => {
  const local = scout.worldToLocal(dronePosition(t)).sub(vec(0, SCOUT_EYE, 0));
  const panGoal = THREE.MathUtils.clamp(Math.atan2(local.x, local.z), -Math.PI / 2, Math.PI / 2);
  const tiltGoal = THREE.MathUtils.clamp(Math.atan2(local.y, Math.hypot(local.x, local.z)), -0.17, Math.PI / 2);
  state.pan += (panGoal - state.pan) * alpha;
  state.tilt += (tiltGoal - state.tilt) * alpha;
};

const alpha = (fps) => 1 - Math.pow(1 - 0.06, 60 / fps);
for (let i = -LOOP_SECONDS * WARMUP_FPS; i < 0; i += 1) step(i / WARMUP_FPS, alpha(WARMUP_FPS));

// Dibujo el cuadro del tiempo t; los cuadros se piden en orden para que el suavizado sea continuo.
window.renderAt = (t, fps) => {
  step(t, alpha(fps));
  const target = dronePosition(t);
  drone.group.position.copy(target);
  drone.group.rotation.set(0.08 * Math.sin(2 * OMEGA * t), OMEGA * t, -0.12 * Math.cos(OMEGA * t));
  drone.spin((t * PROP_TURNS * Math.PI * 2) / LOOP_SECONDS / 55);
  aimRig(rig, state.pan, state.tilt);
  if (rig.led) rig.led.emissiveIntensity = 3 + 1.5 * Math.sin((Math.PI * 2 * LED_PULSES * t) / LOOP_SECONDS);
  camera.position.copy(eye).add(vec(0.55, 0.13, 1.15)).add(vec(Math.sin(OMEGA * t) * 0.05, Math.sin(2 * OMEGA * t) * 0.03, 0));
  camera.lookAt(camera.position.clone().add(vec(-0.42, 0.07, -1).multiplyScalar(10)));
  renderer.render(scene, camera);
  const p = target.clone().project(camera);
  lock.style.left = `${((p.x + 1) / 2) * width}px`;
  lock.style.top = `${((1 - p.y) / 2) * height}px`;
  lock.style.opacity = 1;
};
window.captureReady = true;
</script>
</body>
</html>
